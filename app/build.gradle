plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.paugustin.modaudiofix'
    compileSdk 35

    defaultConfig {
        applicationId "dev.paugustin.modaudiofix"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            // Pas d'obfuscation : on veut pouvoir relire les logs/stacktraces
            // facilement pendant la mise au point sur le vrai device.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
